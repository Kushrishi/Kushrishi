name: Public file review snapshot
on:
  push:
    branches: [audit/public-files-20261031]
    paths: [.github/workflows/public-file-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect the five public repositories at reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          while read -r name revision; do
            git init -q "$RUNNER_TEMP/$name"
            git -C "$RUNNER_TEMP/$name" remote add origin "https://github.com/Kushrishi/$name.git"
            git -C "$RUNNER_TEMP/$name" fetch -q --depth=1 origin "$revision"
            test "$(git -C "$RUNNER_TEMP/$name" rev-parse FETCH_HEAD)" = "$revision"
            git -C "$RUNNER_TEMP/$name" ls-tree -rl "$revision" > "snapshot/$name.inventory.txt"
            git -C "$RUNNER_TEMP/$name" archive --format=tar --prefix="$name/" "$revision" -- . ':!*.woff' ':!*.woff2' ':!*.ttf' ':!*.otf' ':!*.eot' | gzip > "snapshot/$name.tar.gz"
            printf '%s %s\n' "$name" "$revision" >> snapshot/commits.txt
          done <<'REPOS'
          Kushrishi 80347c941a99fd01b89c1804861d263ec1c1ee4f
          autonomy-simulation-lab 50ff70b64a442c1b87f41ce4cb752dc8a94b79d1
          model-regression-forensics 802bf43cb26dd0233d6fa145e770bae6eba35f74
          truemargin 3eb752bee09baf38d3a272dd6ec999d2ddeab497
          kushrishi.com 2f5e3c9e1ce129648c2627f128d4ff470a3da650
          REPOS
          printf '%s\n' 'Public tracked files only. Font binaries excluded; their metadata remains in inventories. No source code, tests, model training or research experiments were executed.' > snapshot/README.txt
      - name: Inspect website dependency advisories without installing or running project code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/website-lock"
          git -C "$RUNNER_TEMP/kushrishi.com" show 2f5e3c9e1ce129648c2627f128d4ff470a3da650:package.json > "$RUNNER_TEMP/website-lock/package.json"
          git -C "$RUNNER_TEMP/kushrishi.com" show 2f5e3c9e1ce129648c2627f128d4ff470a3da650:package-lock.json > "$RUNNER_TEMP/website-lock/package-lock.json"
          set +e
          (cd "$RUNNER_TEMP/website-lock" && npm audit --package-lock-only --ignore-scripts --json) > snapshot/website-npm-audit.json 2> snapshot/website-npm-audit.stderr
          code=$?
          set -e
          printf '%s\n' "$code" > snapshot/website-npm-audit.exit.txt
      - name: Save public audit inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-file-review-inputs
          path: snapshot/
          if-no-files-found: error
          retention-days: 3
